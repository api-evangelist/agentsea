  date: '2026-06-25'
  breaking: false
  highlights:
  - Maturity release - every Beta/WIP package graduated to Stable; backwards compatible.
  - Crews - real LLM execution by default via CoreExecutor (mock now opt-in).
  - Evaluate - real SMTP / PagerDuty Events API v2 / webhook alert channels; HuggingFace dataset import and Hub export.
