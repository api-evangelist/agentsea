apis:
- aid: agentsea:agent-rest-api
  name: AgentSea Agent REST API
  description: >-
    HTTP surface exposed by the AgentSea NestJS module (@lov3kaizen/agentsea-nestjs) when
    enableRestApi/enableWebSocket are set. Documented operations are GET /agents,
    GET /agents/:name, POST /agents/:name/execute, POST /agents/:name/stream (Server-Sent
    Events), and DELETE /agents/:name/conversations/:id, plus a Socket.IO gateway on the
    /agents namespace with execute / getAgent / listAgents events. Self-hosted: the host is the
    consumer's own deployment, so the base is templated rather than vendor-operated.
  humanURL: https://www.agentsea.dev/api/
  baseURL: https://{your-agentsea-host}
  tags:
  - AI Agents
  - Agent Orchestration
  - Server-Sent Events
  - WebSockets
  properties:
  - type: APIReference
    url: https://www.agentsea.dev/api/
  - type: Documentation
    url: https://www.agentsea.dev/docs/nestjs/
- aid: agentsea:llm-gateway
  name: AgentSea LLM Gateway
  description: >-
    OpenAI-compatible HTTP gateway shipped as @lov3kaizen/agentsea-gateway (and as the Elixir
    agentsea_web Phoenix app). Run createHTTPServer/startServer and POST /v1/chat/completions with
    any OpenAI SDK; virtual models "best", "cheapest" and "fastest" route across configured
    providers with load balancing, failover, circuit breaking, caching and cost optimization.
    Self-hosted: the base URL is the consumer's own deployment.
  humanURL: https://www.agentsea.dev/docs/gateway/
  baseURL: https://{your-agentsea-gateway-host}/v1
  tags:
  - Large Language Models
  - Gateway
  - Routing
  properties:
  - type: Documentation
    url: https://www.agentsea.dev/docs/gateway/
