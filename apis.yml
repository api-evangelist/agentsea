aid: agentsea
name: AgentSea
description: >-
  AgentSea is an open-source agent development kit (ADK) for building agentic AI applications,
  authored by Michael Fatoki-Bello and published under the lovekaizen GitHub account. It ships as
  twenty TypeScript/Node packages on npm under the @lov3kaizen/agentsea-* scope and, separately,
  as fourteen native Elixir/OTP libraries on Hex (agentsea_*). The framework covers multi-provider
  LLM access, agent and crew orchestration, sequential/parallel workflows, memory, embeddings,
  guardrails, evaluation, red-teaming, cost tracking, semantic caching, document ingest, prompt
  management, browser and computer use, and voice (TTS/STT), plus a Model Context Protocol client
  and Agentic Commerce Protocol tooling. AgentSea is self-hosted software rather than a
  vendor-operated API - its HTTP surface (an /agents REST + Server-Sent Events + WebSocket API via
  the NestJS module, and an OpenAI-compatible /v1/chat/completions LLM gateway) runs inside the
  consumer's own deployment. MIT licensed.
