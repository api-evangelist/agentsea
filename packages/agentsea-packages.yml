method: searched
source: >-
  https://registry.npmjs.org/@lov3kaizen/agentsea-* and https://hex.pm/api/packages?search=agentsea,
  cross-checked against https://www.agentsea.dev/docs/installation/ and
  https://github.com/lovekaizen/agentsea/releases
note: >-
  AgentSea publishes two first-party package families from the same project: twenty
  TypeScript/Node packages on npm under the @lov3kaizen/agentsea-* scope (monorepo
  github.com/lovekaizen/agentsea, released in lockstep) and fourteen native Elixir/OTP libraries on
  Hex under agentsea_* (github.com/lovekaizen/agentsea-ex). The npm scope is @lov3kaizen (leetspeak
  of the lovekaizen GitHub account) rather than @agentsea; the AgentSea docs and README name these
  packages directly, which is how first-party ownership was established. packages/admin-ui exists in
  the monorepo but is private and deliberately not published to npm - it is recorded here as an
  honest null rather than omitted. All npm packages are on a single lockstep version line.
package_count: 35
official_count: 35
published_count: 34
unpublished_count: 1
